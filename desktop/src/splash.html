<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Vinculato</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", system-ui, sans-serif; }
    html, body { margin: 0; height: 100%; background: #07111f; color: #e6edf7; -webkit-app-region: drag; user-select: none; }
    body { display: grid; place-items: center; border: 1px solid #1a2a44; box-sizing: border-box; }
    main { text-align: center; }
    img { width: 96px; height: 96px; border-radius: 20px; }
    h1 { font-size: 22px; margin: 14px 0 4px; letter-spacing: 0.2px; }
    p { margin: 0; color: #9fb0c8; font-size: 13px; }
    .bar { width: 180px; height: 3px; margin: 20px auto 10px; background: #13233b; border-radius: 2px; overflow: hidden; }
    .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #1e90ff; border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; opacity: 0.6; } }
    small { color: #6b7d97; font-size: 11px; }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="">
    <h1>Vinculato</h1>
    <p>Conectando ao servidor…</p>
    <div class="bar" role="progressbar" aria-label="Conectando"></div>
    <small id="info"></small>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById("info").textContent = [params.get("servidor"), params.get("versao") && "v" + params.get("versao")].filter(Boolean).join(" · ");
  </script>
</body>
</html>
