services:
  - type: web
    name: vinculato-sankhya-worker
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./worker/sankhya/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FDP_INTEGRATION_VAULT_KEYS
        sync: false
      - key: FDP_INTEGRATION_VAULT_KEY_VERSION
        value: "1"
      - key: FDP_PII_HASH_SECRET
        sync: false
      - key: FDP_SANKHYA_BROWSER_ALLOWED_HOSTS
        value: "*.sankhya.com.br"
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: FDP_SANKHYA_WORKER_POLL_MS
        value: "5000"
      - key: FDP_SANKHYA_WORKER_CONCURRENCY
        value: "1"
