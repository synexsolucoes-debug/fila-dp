# Disparo agendado da consulta da Sólides DP e do executor de integrações.
#
# Por que não fica no vercel.json: a conta é Hobby, e a Vercel recusa qualquer
# cron que rode mais de uma vez por dia — o deploy inteiro falha, não só o cron.
# Uma varredura diária deixaria a admissão aparecer com até 24 h de atraso, o que
# não serve. O agendador do GitHub entrega a cadência real sem custo.
#
# Ao migrar para o plano Pro, o caminho natural é mover isto de volta para
# `vercel.json` (`{"crons":[{"path":"/api/cron/integrations","schedule":"17,47 * * * *"}]}`)
# e desativar este workflow, para ter um mecanismo só.
name: Executor de integrações

on:
  schedule:
    # Duas vezes por hora preserva a franquia gratuita de Actions. O disparo
    # manual do Sankhya continua imediato pela API do GitHub.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  # Duas varreduras simultâneas não corrompem a fila — o lease usa FOR UPDATE
  # SKIP LOCKED — mas gastam execução à toa.
  group: integrations-cron
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar a Sólides DP e drenar a fila
        env:
          SECRET: ${{ secrets.INTEGRATIONS_CRON_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET}" ]; then
            echo "Defina o segredo INTEGRATIONS_CRON_SECRET no repositório." >&2
            exit 1
          fi
          # O alias canônico evita redirecionamento entre domínios, que removeria
          # o cabeçalho Authorization. A resposta contém somente contagens.
          executor_url="https://vinculato.vercel.app/api/cron/integrations"
          codigo=$(curl -sS -o resposta.json -w "%{http_code}" \
            --max-time 120 \
            -H "Authorization: Bearer ${SECRET}" \
            "${executor_url}")
          echo "HTTP ${codigo}"
          cat resposta.json
          echo
          if [ "${codigo}" != "200" ]; then
            echo "O executor respondeu ${codigo}." >&2
            exit 1
          fi
          pendentes=$(jq -r '.sankhyaPending // 0' resposta.json)
          despacho=$(jq -r '.workerDispatch // "not_configured"' resposta.json)
          if [ "${pendentes}" -gt 0 ] && [ "${despacho}" != "dispatched" ]; then
            echo "Disparando o worker Sankhya pelo token efêmero do workflow."
            gh workflow run sankhya-worker.yml --repo "${GITHUB_REPOSITORY}" --ref main
          fi

      # Monitor de saúde. `/api/health` já separa "o schema está em dia" de "a
      # operação parou" (a varredura que morreu com `syntax error at or near
      # "grant"` respondia 200 enquanto parada) — mas ninguém o consultava. Fica
      # neste workflow, e não num agendamento próprio, para não gastar minutos
      # de Actions além dos que a varredura já usa.
      #
      # Reprova (e o GitHub avisa por e-mail quem mantém o agendamento) quando
      # o veredito é crítico, o banco não responde ou há migration pendente.
      # "Degradado" vira aviso no resumo da execução: pode ser só capacidade
      # opcional sem configuração, e reprovar por isso todo dia ensinaria a
      # ignorar o alerta.
      - name: Conferir a saúde da produção
        if: always()
        run: |
          set -uo pipefail
          codigo=$(curl -sS -o saude.json -w "%{http_code}" --max-time 60 "https://vinculato.vercel.app/api/health" || echo "000")
          echo "HTTP ${codigo}"
          if [ "${codigo}" = "000" ] || ! jq -e . saude.json > /dev/null 2>&1; then
            echo "::error title=Vinculato fora do ar::/api/health não respondeu (HTTP ${codigo})."
            exit 1
          fi
          gravidade=$(jq -r '.severity // "desconhecida"' saude.json)
          banco=$(jq -r '.database // "desconhecido"' saude.json)
          pendentes=$(jq -r '.pendingMigrations // 0' saude.json)
          detalhe=$(jq -r '[.detail, .operation.detail] | map(select(. != null)) | join(" ")' saude.json)
          echo "Gravidade: ${gravidade} · banco: ${banco} · migrations pendentes: ${pendentes}"
          echo "${detalhe}"
          {
            echo "### Saúde da produção: ${gravidade}"
            echo
            echo "${detalhe}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${gravidade}" = "critico" ] || [ "${banco}" != "ok" ] || [ "${pendentes}" != "0" ]; then
            echo "::error title=Vinculato crítico::${detalhe}"
            exit 1
          fi
          if [ "${gravidade}" = "degradado" ]; then
            echo "::warning title=Vinculato degradado::${detalhe}"
          fi
